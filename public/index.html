<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── CONFIG ───────────────────────────────────────────────────
const SUPABASE_URL  = "https://ptvkywxtrzyntjirmebv.supabase.co";
const SUPABASE_ANON = "sb_publishable_fJ_BlP4JTZPD3f3gFIn8FA_Jzwba6uW";

// ─── SESSION HELPERS ──────────────────────────────────────────
function getStoredSession() {
  try { return JSON.parse(localStorage.getItem("leadai_session")||"null"); }
  catch { return null; }
}
function storeSession(s) {
  s ? localStorage.setItem("leadai_session",JSON.stringify(s))
    : localStorage.removeItem("leadai_session");
}
function getLs(k,d) {
  try { const v=localStorage.getItem(k); return v!=null?JSON.parse(v):d; }
  catch { return d; }
}
function setLs(k,v) { localStorage.setItem(k,JSON.stringify(v)); }

// ─── FETCH BASE ───────────────────────────────────────────────
// CORREÇÃO: sempre lê a sessão do localStorage na hora da chamada
// para evitar closure stale com token antigo
async function sbFetch(path, opts={}) {
  const session = getStoredSession(); // lê sempre fresh
  const headers = {
    "apikey": SUPABASE_ANON,
    "Content-Type": "application/json",
    ...(session?.access_token ? { "Authorization": `Bearer ${session.access_token}` } : {}),
    ...(opts.headers || {})
  };
  const res = await fetch(`${SUPABASE_URL}${path}`, { ...opts, headers });
  const text = await res.text();
  try { return { ok: res.ok, status: res.status, data: JSON.parse(text) }; }
  catch { return { ok: res.ok, status: res.status, data: text }; }
}

// ─── SUPABASE PERSISTENCE ─────────────────────────────────────

// Carrega perfil do usuário — cria se não existir
// Usa apenas a tabela "profiles" (coluna: id, email, plan, credits)
async function loadUserData(userId, email) {
  if (!userId || userId === "demo") return null;
  try {
    const { ok, data } = await sbFetch(
      `/rest/v1/profiles?id=eq.${userId}&select=id,email,plan,credits`,
      { headers: { "Accept": "application/json" } }
    );

    if (ok && Array.isArray(data) && data.length > 0) {
      const p = data[0];
      return {
        plan:    p.plan    || "free",
        credits: p.credits != null ? Number(p.credits) : 50
      };
    }

    // Perfil não existe → cria com valores padrão
    const newProfile = { id: userId, email: email || "", plan: "free", credits: 50 };
    await sbFetch("/rest/v1/profiles", {
      method: "POST",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify(newProfile)
    });
    return { plan: "free", credits: 50 };

  } catch(e) {
    console.warn("Erro loadUserData:", e);
    return { plan: "free", credits: 50 }; // fallback seguro
  }
}

// Salva atualizações no perfil (plan, credits, etc.)
async function saveProfileToSupabase(userId, updates) {
  if (!userId || userId === "demo") return;
  try {
    // PATCH no registro existente
    const { ok, status } = await sbFetch(
      `/rest/v1/profiles?id=eq.${userId}`,
      {
        method: "PATCH",
        headers: { "Prefer": "return=minimal" },
        body: JSON.stringify(updates)
      }
    );

    // Se nenhuma row afetada (404 ou status inesperado), faz upsert
    if (!ok || status === 404) {
      await sbFetch("/rest/v1/profiles", {
        method: "POST",
        headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ id: userId, ...updates })
      });
    }
  } catch(e) { console.warn("Erro saveProfile:", e); }
}

// Salva array de leads novos (upsert por id)
async function saveLeadsToSupabase(leads, userId) {
  if (!userId || userId === "demo" || !leads || leads.length === 0) return;
  try {
    const rows = leads.map(l => ({
      id:           l.id,
      user_id:      userId,
      name:         l.name,
      segment:      l.segment,
      city:         l.city,
      phone:        l.phone    || null,
      rating:       l.rating   || 0,
      review_count: l.review_count || 0,
      has_whatsapp: !!l.has_whatsapp,
      website:      l.website  || null,
      ai_score:     l.ai_score || 0,
      score_label:  l.score_label || "",
      pain_points:  l.pain_points || [],
      ai_message:   l.ai_message  || "",
      status:       l.status   || "new",
      history:      l.history  || []
    }));
    await sbFetch("/rest/v1/leads?on_conflict=id", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows)
    });
  } catch(e) { console.warn("Erro saveLeads:", e); }
}

// Carrega todos os leads do usuário
async function loadLeadsFromSupabase(userId) {
  if (!userId || userId === "demo") return [];
  try {
    const { ok, data } = await sbFetch(
      `/rest/v1/leads?user_id=eq.${userId}&order=created_at.desc&limit=500`,
      { headers: { "Accept": "application/json" } }
    );
    if (!ok || !Array.isArray(data)) return [];
    return data.map(l => ({
      id:           l.id,
      name:         l.name,
      segment:      l.segment,
      city:         l.city,
      phone:        l.phone,
      rating:       l.rating,
      review_count: l.review_count,
      has_whatsapp: l.has_whatsapp,
      website:      l.website,
      ai_score:     l.ai_score,
      score_label:  l.score_label,
      pain_points:  l.pain_points  || [],
      ai_message:   l.ai_message,
      status:       l.status       || "new",
      history:      l.history      || []
    }));
  } catch(e) { console.warn("Erro loadLeads:", e); return []; }
}

// Atualiza campos específicos de um lead
async function updateLeadInSupabase(leadId, updates, userId) {
  if (!userId || userId === "demo") return;
  try {
    const allowed = {};
    if (updates.status      !== undefined) allowed.status      = updates.status;
    if (updates.ai_message  !== undefined) allowed.ai_message  = updates.ai_message;
    if (updates.history     !== undefined) allowed.history     = updates.history;
    if (Object.keys(allowed).length === 0) return;
    await sbFetch(`/rest/v1/leads?id=eq.${leadId}&user_id=eq.${userId}`, {
      method: "PATCH",
      headers: { "Prefer": "return=minimal" },
      body: JSON.stringify(allowed)
    });
  } catch(e) { console.warn("Erro updateLead:", e); }
}

// ─── HELPERS ──────────────────────────────────────────────────
function timeAgo(ts) {
  const d=(Date.now()-ts)/1000;
  if(d<60) return "agora";
  if(d<3600) return `${Math.floor(d/60)}min atrás`;
  if(d<86400) return `${Math.floor(d/3600)}h atrás`;
  return `${Math.floor(d/86400)}d atrás`;
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
}
function ScoreRing({ score, size=60 }) {
  const r=36,c=2*Math.PI*r,offset=c-(score/100)*c;
  const color=score>=80?"#22c55e":score>=60?"#f59e0b":"#6b7280";
  return (
    <svg width={size} height={size} viewBox="0 0 80 80">
      <circle cx="40" cy="40" r={r} fill="none" stroke="#1e1e2e" strokeWidth="8"/>
      <circle cx="40" cy="40" r={r} fill="none" stroke={color} strokeWidth="8"
        strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
        transform="rotate(-90 40 40)" style={{transition:"stroke-dashoffset 1.2s ease"}}/>
      <text x="40" y="46" textAnchor="middle" fill={color} fontSize="16" fontWeight="bold">{score}</text>
    </svg>
  );
}
function Spinner() { return <div className="w-5 h-5 border-2 border-white/20 border-t-white rounded-full spin inline-block"/>; }
function Badge({ text, color="indigo" }) {
  const c={indigo:"bg-indigo-500/20 text-indigo-300 border-indigo-500/30",green:"bg-green-500/20 text-green-300 border-green-500/30",yellow:"bg-yellow-500/20 text-yellow-300 border-yellow-500/30",red:"bg-red-500/10 text-red-300 border-red-500/20",gray:"bg-gray-500/20 text-gray-300 border-gray-500/30",purple:"bg-purple-500/20 text-purple-300 border-purple-500/30",blue:"bg-blue-500/20 text-blue-300 border-blue-500/30",teal:"bg-teal-500/20 text-teal-300 border-teal-500/30"};
  return <span className={`text-xs px-2 py-0.5 rounded-full border ${c[color]||c.indigo}`}>{text}</span>;
}

// ─── TIP BOX ──────────────────────────────────────────────────
const TIPS = {
  search: { icon:"💡", title:"Dica de extração", text:"Nichos com nota entre 3.0 e 4.0 têm mais dores ativas para resolver — são os leads mais quentes!", dismiss:"tip_search" },

function TipBox({ page }) {
  const tip=TIPS[page];

  if(!tip||!visible) return null;
  return (
    <div className="mx-4 mb-3 glass rounded-xl p-3 tip-box border border-indigo-500/20 slide-in">
      <div className="flex items-start gap-2">
        <span className="text-lg flex-shrink-0">{tip.icon}</span>

        </div>
        <button onClick={()=>{setLs(tip.dismiss,true);setVisible(false);}} className="text-gray-600 hover:text-gray-400 text-lg leading-none ml-1 flex-shrink-0">✕</button>
      </div>
    </div>
  );

}

// ─── CAMPAIGN REPORT ──────────────────────────────────────────
function CampaignReport({ leads }) {
  const total=leads.length,sent=leads.filter(l=>l.status!=="new").length,replied=leads.filter(l=>["replied","closed"].includes(l.status)).length,closed=leads.filter(l=>l.status==="closed").length;
  const convRate=sent>0?Math.round(closed/sent*100):0,respRate=sent>0?Math.round(replied/sent*100):0,hotCount=leads.filter(l=>l.ai_score>=80).length;
  const bars=[{label:"Extraídos",value:total,color:"#6366f1",pct:100},{label:"Enviados",value:sent,color:"#f59e0b",pct:total>0?Math.round(sent/total*100):0},{label:"Respostas",value:replied,color:"#3b82f6",pct:total>0?Math.round(replied/total*100):0},{label:"Fechados",value:closed,color:"#22c55e",pct:total>0?Math.round(closed/total*100):0}];
  return (
    <div className="px-4 mt-4">
      <div className="flex items-center justify-between mb-3"><h2 className="font-bold text-sm">📈 Relatório da Campanha</h2><Badge text="Acumulado" color="indigo"/></div>
      <div className="glass rounded-2xl p-4 border border-white/5">
        <div className="space-y-3 mb-4">{bars.map(b=><div key={b.label} className="flex items-center gap-3"><span className="text-xs text-gray-400 w-16 flex-shrink-0">{b.label}</span><div className="flex-1 h-5 bg-white/5 rounded-full overflow-hidden relative"><div className="h-full rounded-full transition-all duration-1000" style={{width:`${b.pct}%`,background:`linear-gradient(90deg,${b.color}99,${b.color})`}}/><span className="absolute inset-0 flex items-center px-2 text-[10px] font-bold text-white">{b.value}</span></div><span className="text-xs font-bold w-8 text-right" style={{color:b.color}}>{b.pct}%</span></div>)}</div>
        <div className="grid grid-cols-3 gap-2 pt-3 border-t border-white/8">
          {[{label:"Conv. Rate",value:`${convRate}%`,color:"text-green-400",icon:"🏆"},{label:"Resp. Rate",value:`${respRate}%`,color:"text-blue-400",icon:"💬"},{label:"Quentes",value:hotCount,color:"text-orange-400",icon:"🔥"}].map(k=>(
            <div key={k.label} className="glass rounded-xl p-2 text-center border border-white/5"><p className="text-sm mb-0.5">{k.icon}</p><p className={`font-black text-base ${k.color}`}>{k.value}</p><p className="text-gray-600 text-[10px]">{k.label}</p></div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── AUTH SCREEN ──────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode,setMode]=useState("login");
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [name,setName]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [success,setSuccess]=useState("");

  useEffect(()=>{
    const params=new URLSearchParams(window.location.search);
    if(params.get("payment")==="success"){
      const plan=params.get("plan");
      const em=params.get("email");
      if(em) setEmail(em);
      setSuccess(`✅ Pagamento confirmado! Faça login para acessar o plano ${plan==="pro"?"Pro":"Starter"}.`);
      window.history.replaceState({},"","/");
    }
  },[]);

  const submit=async()=>{
    setError("");setSuccess("");
    if(!email||(!password&&mode!=="forgot")){setError("Preencha todos os campos");return;}
    setLoading(true);
    try {
      if(mode==="login"){
        const {ok,data}=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});
        if(!ok) throw new Error(data.error_description||"Credenciais inválidas");
        // CORREÇÃO: salva user junto com session para restauração confiável
        const sessionWithUser = { ...data, user: data.user };
        storeSession(sessionWithUser);
        onAuth({ session: data, user: data.user });
      } else if(mode==="signup"){
        if(!name){setError("Digite seu nome");setLoading(false);return;}
        const {ok,data}=await sbFetch("/auth/v1/signup",{method:"POST",body:JSON.stringify({email,password,data:{full_name:name}})});
        if(!ok) throw new Error(data.error_description||"Erro ao cadastrar");
        if(data.access_token){
          const sessionWithUser = { ...data, user: data.user };
          storeSession(sessionWithUser);
          onAuth({ session: data, user: data.user });
        } else {
          setSuccess("✅ Verifique seu email para confirmar o cadastro!");
        }
      } else {
        await sbFetch("/auth/v1/recover",{method:"POST",body:JSON.stringify({email})});
        setSuccess("✅ Link enviado para seu email!");
      }
    } catch(e){setError(e.message);}
    setLoading(false);
  };

  const demo=()=>{
    const demoSession = { access_token:"demo", user:{ id:"demo", email:"demo@leadai.com", user_metadata:{ full_name:"Usuário Demo" } } };
    storeSession(demoSession);
    onAuth({ session:demoSession, user:demoSession.user });
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-4 bg-[#0f0f1a] relative overflow-hidden fade-in">
      <div className="absolute top-0 left-1/2 -translate-x-1/2 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"/>
      <div className="mb-8 text-center">
        <div className="w-16 h-16 gradient-btn rounded-2xl flex items-center justify-center text-3xl mb-3 mx-auto glow">🤖</div>
        <h1 className="text-3xl font-black gradient-text">LeadAI Pro</h1>
        <p className="text-gray-400 text-sm mt-1">Prospecção inteligente com IA</p>
      </div>
      <div className="glass rounded-3xl p-6 w-full max-w-sm border border-white/10">
        <div className="flex glass rounded-xl p-1 mb-5">{[["login","Entrar"],["signup","Cadastrar"]].map(([m,l])=><button key={m} onClick={()=>{setMode(m);setError("");setSuccess("");}} className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all ${mode===m?'gradient-btn text-white':'text-gray-400'}`}>{l}</button>)}</div>
        <div className="space-y-3">
          {mode==="signup"&&<div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">NOME</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: João Silva" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>}
          <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">EMAIL</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>
          {mode!=="forgot"&&<div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">SENHA</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Mínimo 8 caracteres" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/></div>}
          {error&&<div className="text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2 shake">{error}</div>}
          {success&&<div className="text-green-400 text-xs bg-green-500/10 border border-green-500/20 rounded-xl px-3 py-2">{success}</div>}
          <button onClick={submit} disabled={loading} className="w-full gradient-btn rounded-2xl py-3.5 font-bold text-white flex items-center justify-center gap-2 glow disabled:opacity-50">{loading?<><Spinner/> Aguarde...</>:mode==="login"?"🚀 Entrar":mode==="signup"?"✨ Criar conta":"📧 Enviar link"}</button>
          {mode==="login"&&<button onClick={()=>setMode("forgot")} className="w-full text-xs text-gray-500 hover:text-gray-300 py-1">Esqueci minha senha</button>}
          <div className="flex items-center gap-3"><div className="flex-1 h-px bg-white/10"/><span className="text-xs text-gray-600">ou</span><div className="flex-1 h-px bg-white/10"/></div>
          <button onClick={demo} className="w-full glass rounded-2xl py-3 text-sm text-gray-300 border border-white/10 hover:border-indigo-500/40 flex items-center justify-center gap-2 transition-all">👀 Explorar em modo demo</button>
        </div>
      </div>
    </div>
  );
}

function CheckoutModal({ plan, userEmail, userName, onClose, onSuccess }) {
  const [step, setStep] = useState("form");
  const [name, setName] = useState(userName || "");
  const [email, setEmail] = useState(userEmail || "");
  const [cpf, setCpf] = useState("");
  const [error, setError] = useState("");
  const [payUrl, setPayUrl] = useState("");
  const planInfo = PLANS.find(p => p.id === plan);

  const handlePay = async () => {
    if (!name || !email) { setError("Nome e email são obrigatórios"); return; }
    setStep("processing"); setError("");
    try {
      const res = await fetch("/api/create-checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ planId: plan, customerName: name, customerEmail: email, customerCpfCnpj: cpf || null }) });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setPayUrl(data.paymentUrl); setStep("redirect");
      window.open(data.paymentUrl, "_blank");
    } catch(e) { setError(e.message); setStep("form"); }
  };

  return (
    <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md fade-in" onClick={onClose}>
      <div className="glass-dark w-full max-w-sm rounded-3xl border border-white/10 overflow-hidden slide-up" onClick={e=>e.stopPropagation()}>
        <div className={`p-5 ${plan==="pro"?"gradient-gold":"gradient-btn"}`}>
          <div className="flex items-center justify-between">
            <div><p className="text-xs text-white/70 uppercase tracking-wide font-semibold">Assinar plano</p><h2 className="text-xl font-black text-white">{planInfo?.label} — R$ {planInfo?.price}/mês</h2></div>
            <button onClick={onClose} className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-all">✕</button>
          </div>
          <div className="flex flex-wrap gap-2 mt-3">{[{icon:"💳",label:"Cartão em até 6x"},{icon:"⚡",label:"Pix instantâneo"},{icon:"📄",label:"Boleto bancário"}].map(m=><span key={m.label} className="text-xs bg-white/20 text-white px-2.5 py-1 rounded-full font-medium">{m.icon} {m.label}</span>)}</div>
        </div>
        {step==="form"&&<div className="p-5 space-y-3">
          <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">Nome completo *</label><input value={name} onChange={e=>setName(e.target.value)} placeholder="Seu nome" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none border border-white/10 focus:border-indigo-500"/></div>
          <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">Email *</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none border border-white/10 focus:border-indigo-500"/></div>
          <div><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">CPF/CNPJ (opcional)</label><input value={cpf} onChange={e=>setCpf(e.target.value)} placeholder="000.000.000-00" className="w-full glass rounded-xl px-4 py-3 text-sm outline-none border border-white/10 focus:border-indigo-500"/></div>
          {error&&<div className="text-red-400 text-xs bg-red-500/10 border border-red-500/20 rounded-xl px-3 py-2">{error}</div>}
          <div className="glass rounded-xl p-3 border border-white/5"><p className="text-xs text-gray-400 leading-relaxed">🔒 Pagamento 100% seguro via <strong className="text-white">Asaas</strong>. Cancele quando quiser.</p></div>
          <button onClick={handlePay} className={`w-full rounded-2xl py-4 font-bold text-white text-sm flex items-center justify-center gap-2 transition-all ${plan==="pro"?"gradient-gold glow-gold":"gradient-btn glow"}`}>💳 Ir para o Pagamento — R$ {planInfo?.price}/mês</button>
          <p className="text-[10px] text-gray-600 text-center">Assinatura mensal recorrente. Cancele quando quiser.</p>
        </div>}
        {step==="processing"&&<div className="p-8 text-center"><Spinner/><p className="text-sm text-gray-300 mt-4">Preparando seu pagamento seguro...</p></div>}
        {step==="redirect"&&<div className="p-6 text-center">
          <div className="w-16 h-16 bg-green-500/20 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-green-500/30">✅</div>

          <a href={payUrl} target="_blank" rel="noreferrer" className="w-full block gradient-btn rounded-xl py-3 font-bold text-white text-sm text-center mb-3">🔗 Abrir novamente</a>
          <button onClick={onClose} className="w-full glass rounded-xl py-3 text-gray-400 text-sm border border-white/10">Fechar</button>
        </div>}
      </div>
    </div>
  );

// ─── SEARCH PAGE ──────────────────────────────────────────────
function SearchPage({ onLeadsFound, plan, credits, onNeedUpgrade }) {
  const [form,setForm]=useState({niche:"",city:"",radius:"10",minRating:"3.5",minReviews:"20"});
  const [loading,setLoading]=useState(false);
  const [step,setStep]=useState("");
  const [done,setDone]=useState(false);
  const [resultCount,setResultCount]=useState(0);
  const [errorMsg,setErrorMsg]=useState("");
  const niches=["Clínica de Estética","Salão de Beleza","Restaurante","Academia","Farmácia","Odontologia","Advocacia","Contabilidade","Auto Peças","Petshop","Dentista","Mecânica"];
  const planInfo=PLANS.find(p=>p.id===plan)||PLANS[0];

  const run=async()=>{
    if(credits !== null && credits <= 0){
      setErrorMsg("Você não tem créditos disponíveis. Faça upgrade do plano.");
      return;
    }
    if(!form.niche||!form.city){alert("Preencha nicho e cidade!");return;}
    setLoading(true);setDone(false);setErrorMsg("");
    const steps=["🔍 Buscando no Google Maps...","✅ Estabelecimentos encontrados","🧹 Filtrando por critérios...","📱 Validando dados...","🤖 IA analisando avaliações...","✨ Gerando scores de oportunidade..."];
    let si=0; setStep(steps[si]);
    const stepInterval=setInterval(()=>{si=Math.min(si+1,steps.length-1);setStep(steps[si]);},900);
    try {
      const resp=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({niche:form.niche,city:form.city,minRating:form.minRating,minReviews:form.minReviews,plan})});
      clearInterval(stepInterval);
      const contentType=resp.headers.get("content-type")||"";
      if(!contentType.includes("application/json")){const text=await resp.text();throw new Error(`Resposta inesperada: ${text.slice(0,120)}`);}
      const result=await resp.json();
      if(result.error) throw new Error(result.error);
      if(!result.leads||result.leads.length===0){setErrorMsg("Nenhum lead encontrado. Tente aumentar o raio ou diminuir os filtros.");setLoading(false);return;}
      setResultCount(result.leads.length);
      onLeadsFound(result.leads);
      setDone(true);
    } catch(e){clearInterval(stepInterval);setErrorMsg("Erro: "+e.message);}
    setLoading(false);
  };

  return (
    <div className="pb-24 slide-in">
      <div className="px-4 pt-6 pb-2"><h1 className="text-xl font-bold gradient-text">🔍 Extrair Leads</h1><p className="text-gray-400 text-sm">Configure e deixa a IA trabalhar · Limite: {planInfo.maxLeads} leads/busca</p></div>
      <TipBox page="search"/>
      <div className="px-4 space-y-4">
        <div>
          <label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">NICHO *</label>
          <input value={form.niche} onChange={e=>setForm({...form,niche:e.target.value})} placeholder="Ex: Clínica de Estética..." className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/>
          <div className="flex flex-wrap gap-2 mt-2">{niches.slice(0,8).map(n=><button key={n} onClick={()=>setForm({...form,niche:n})} className={`text-xs px-3 py-1 rounded-full border transition-all ${form.niche===n?'border-indigo-500 bg-indigo-500/20 text-indigo-300':'border-white/10 text-gray-500 hover:border-white/30'}`}>{n}</button>)}</div>
        </div>
        <div>
          <label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">CIDADE *</label>
          <input value={form.city} onChange={e=>setForm({...form,city:e.target.value})} placeholder="Ex: São Paulo, Campinas, Sumaré..." className="w-full glass rounded-xl px-4 py-3 text-sm outline-none focus:border-indigo-500 border border-white/10"/>
        </div>
        <div className="grid grid-cols-2 gap-3">
          {[["radius","RAIO (KM)",["5","10","20","50"].map(v=>({v,l:`${v} km`}))],["minRating","NOTA MÍNIMA ★",["2","2.5","3","3.5","4","4.5"].map(v=>({v,l:`≥ ${v}`}))],["minReviews","MIN. AVALIAÇÕES",["10","20","50","100"].map(v=>({v,l:`≥ ${v}`}))]].map(([key,label,opts])=>(
            <div key={key}><label className="text-xs text-gray-400 mb-1 block uppercase tracking-wide">{label}</label><select value={form[key]} onChange={e=>setForm({...form,[key]:e.target.value})} className="w-full glass rounded-xl px-3 py-3 text-sm outline-none border border-white/10 bg-transparent">{opts.map(({v,l})=><option key={v} value={v}>{l}</option>)}</select></div>
          ))}
        </div>
        {plan==="free"&&<div className="glass rounded-xl p-3 border border-yellow-500/20 flex items-start gap-2"><span className="text-lg">⚠️</span><div className="flex-1"><p className="text-xs text-yellow-300 font-semibold">Plano Free — máximo 10 leads</p><button onClick={onNeedUpgrade} className="text-xs text-indigo-400 mt-0.5">Fazer upgrade →</button></div></div>}
        {loading&&<div className="glass rounded-2xl p-4 border border-indigo-500/30"><div className="flex items-center gap-3 mb-2"><Spinner/><p className="text-sm text-indigo-300">{step}</p></div><div className="h-1.5 bg-white/10 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full animate-pulse" style={{width:"70%"}}/></div></div>}
        {errorMsg&&<div className="glass rounded-2xl p-4 border border-red-500/30"><p className="text-red-400 font-semibold text-sm">❌ {errorMsg}</p></div>}
        {done&&<div className="glass rounded-2xl p-4 border border-green-500/30 glow-green"><p className="text-green-400 font-semibold">✅ {resultCount} leads extraídos e salvos!</p><p className="text-gray-400 text-xs mt-1">Veja os resultados na aba Leads</p></div>}
        <button onClick={run} disabled={loading} className="w-full gradient-btn rounded-2xl py-4 font-bold text-white glow flex items-center justify-center gap-2 disabled:opacity-50">{loading?<><Spinner/> Processando...</>:<><span>🚀</span> Extrair e Analisar com IA</>}</button>
      </div>
    </div>
  );
}

  );
}

// ─── BOTTOM NAV ───────────────────────────────────────────────
function BottomNav({ active, onChange }) {
  const tabs=[{id:"dashboard",icon:"🏠",label:"Início"},{id:"search",icon:"🔍",label:"Buscar"},{id:"leads",icon:"📋",label:"Leads"},{id:"crm",icon:"📊",label:"CRM"},{id:"profile",icon:"👤",label:"Perfil"}];
  return (
    <nav className="bottom-nav-mobile fixed bottom-0 left-0 right-0 z-40 glass border-t border-white/10">
      <div className="flex max-w-lg mx-auto">
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>onChange(t.id)} className={`flex-1 py-3 flex flex-col items-center gap-0.5 transition-all ${active===t.id?'text-indigo-400':'text-gray-600'}`}>
            <span className="text-xl">{t.icon}</span>
            <span className="text-[10px] font-medium">{t.label}</span>
            {active===t.id&&<div className="w-1 h-1 rounded-full bg-indigo-400"/>}
          </button>
        ))}
      </div>
    </nav>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────
function App() {
  const [auth, setAuth]           = useState(null);
  const [page, setPage]           = useState(getPageFromHash);
  const [leads, setLeads]         = useState([]);
  const [plan, setPlan]           = useState("free");
  const [credits, setCredits]     = useState(null);
  const [showOnboard, setShowOnboard] = useState(false);
  const [checkoutPlan, setCheckoutPlan] = useState(null);
  const [loadingLeads, setLoadingLeads] = useState(false);

  // ── 1. Restaurar sessão do localStorage na inicialização ──
  // CORREÇÃO PRINCIPAL: user é guardado dentro da sessão no login,
  // então sempre temos auth.user disponível sem precisar fazer
  // outra chamada de API, evitando race condition.
  useEffect(() => {
    const s = getStoredSession();
    if (!s) return;

    if (s.access_token === "demo") {
      setAuth({
        session: s,
        user: s.user || { id:"demo", email:"demo@leadai.com", user_metadata:{ full_name:"Usuário Demo" } }
      });
      setCredits(50);
      return;
    }

    // Token real: restaura user que foi salvo junto
    if (s.access_token && s.user?.id) {
      setAuth({ session: s, user: s.user });
    }
  }, []);

  // ── 2. Carregar leads + perfil quando auth muda ──
  // CORREÇÃO: userId capturado antes do Promise.all para evitar closure stale
  useEffect(() => {
    if (!auth?.user?.id) return;
    const userId    = auth.user.id;
    const userEmail = auth.user.email || "";

    if (userId === "demo") {
      setCredits(50);
      setPlan("free");
      return;
    }

    setLoadingLeads(true);
    Promise.all([
      loadLeadsFromSupabase(userId),
      loadUserData(userId, userEmail)
    ])
    .then(([savedLeads, profile]) => {
      if (savedLeads && savedLeads.length > 0) {
        setLeads(savedLeads);
      }
      if (profile) {
        setPlan(profile.plan    || "free");
        setCredits(profile.credits != null ? Number(profile.credits) : 50);
      } else {
        // fallback se loadUserData retornar null
        setPlan("free");
        setCredits(50);
      }
    })
    .catch(err => {
      console.warn("Erro ao carregar dados:", err);
      setPlan("free");
      setCredits(50);
    })
    .finally(() => setLoadingLeads(false));
  }, [auth]);

  // ── 3. Hash navigation ──
  useEffect(() => {
    const onHash = () => { const p = getPageFromHash(); setPage(p); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  useEffect(() => {
    if (window.location.hash.replace("#","") !== page) {
      window.history.pushState(null, "", `#${page}`);
    }
  }, [page]);

  // ── 4. Onboarding ──
  useEffect(() => {
    if (auth && !getLs("onboard_done", false)) setShowOnboard(true);
  }, [auth]);

  const navigate = (p) => {
    setPage(p);
    window.history.pushState(null, "", `#${p}`);
  };

  // CORREÇÃO: salva user junto com session para restauração confiável
  const handleAuth = (a) => {
    const sessionToStore = { ...a.session, user: a.user };
    storeSession(sessionToStore);
    setAuth(a);
  };

  const handleLogout = () => {
    storeSession(null);
    setAuth(null);
    setPage("dashboard");
    setLeads([]);
    setCredits(null);
    setPlan("free");
    window.history.pushState(null, "", "#dashboard");
  };

  const handleOnboardDone = () => { setLs("onboard_done", true); setShowOnboard(false); };

  // CORREÇÃO: userId capturado fora do setLeads callback para evitar closure stale
  const handleLeadsFound = async (newLeads) => {
    const userId = auth?.user?.id;

    setLeads(prev => {
      const newIds = new Set(newLeads.map(l => l.id));
      // Merge: novos leads na frente, antigos que não estão nos novos atrás
      return [...newLeads, ...prev.filter(l => !newIds.has(l.id))];
    });

    // Salva no Supabase fora do setLeads (userId já capturado)
    if (userId && userId !== "demo") {
      saveLeadsToSupabase(newLeads, userId);
    }

    navigate("leads");

    // Decrementa crédito e persiste
    setCredits(prev => {
      const current  = prev != null ? prev : 50;
      const novoValor = Math.max(0, current - 1);
      if (userId && userId !== "demo") {
        saveProfileToSupabase(userId, { credits: novoValor });
      }
      return novoValor;
    });
  };

  const handleStatus = (id, status) => {
    const userId = auth?.user?.id;
    setLeads(prev => prev.map(l => {
      if (l.id !== id) return l;
      const updated = { ...l, status };
      if (userId && userId !== "demo") updateLeadInSupabase(id, { status }, userId);
      return updated;
    }));
  };

  const handleUpdateLead = (id, updates) => {
    const userId = auth?.user?.id;
    setLeads(prev => prev.map(l => {
      if (l.id !== id) return l;
      const updated = { ...l, ...updates };
      if (userId && userId !== "demo") updateLeadInSupabase(id, updates, userId);
      return updated;
    }));
  };

  const handleCheckout  = (planId) => setCheckoutPlan(planId);
  const handleCheckoutClose = () => setCheckoutPlan(null);
  const handleCheckoutSuccess = (p) => {
    const userId = auth?.user?.id;
    const nc = PLANS.find(x => x.id === p)?.credits || 50;
    setPlan(p);
    setCredits(nc);
    if (userId && userId !== "demo") {
      saveProfileToSupabase(userId, { plan: p, credits: nc });
    }
    setCheckoutPlan(null);
    navigate("dashboard");
  };

  if (!auth) return <AuthScreen onAuth={handleAuth}/>;

  if (page === "plans") return (
    <div className="min-h-screen bg-[#0f0f1a] max-w-lg mx-auto">
      <PlansScreen
        currentPlan={plan}
        userEmail={auth.user?.email}
        userName={auth.user?.user_metadata?.full_name}
        onBack={()=>navigate("dashboard")}
        onCheckout={handleCheckout}
      />
      {checkoutPlan && (
        <CheckoutModal
          plan={checkoutPlan}
          userEmail={auth.user?.email}
          userName={auth.user?.user_metadata?.full_name}
          onClose={handleCheckoutClose}
          onSuccess={handleCheckoutSuccess}
        />
      )}
    </div>
  );

  return (
    <div className="min-h-screen bg-[#0f0f1a]">
      <div className="fixed inset-0 pointer-events-none">
        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-96 bg-indigo-600/10 rounded-full blur-3xl"/>
        <div className="absolute bottom-20 right-0 w-64 h-64 bg-purple-600/10 rounded-full blur-3xl"/>
      </div>
      {showOnboard && <OnboardingModal onDone={handleOnboardDone}/>}
      {checkoutPlan && (
        <CheckoutModal
          plan={checkoutPlan}
          userEmail={auth.user?.email}
          userName={auth.user?.user_metadata?.full_name}
          onClose={handleCheckoutClose}
          onSuccess={handleCheckoutSuccess}
        />
      )}
      {loadingLeads && (
        <div className="fixed top-4 right-4 z-50 glass rounded-xl px-3 py-2 text-xs text-indigo-300 border border-indigo-500/30 flex items-center gap-2">
          <Spinner/> Carregando seus leads...
        </div>
      )}
      <div className="desktop-shell">
        <DesktopSidebar active={page} onChange={navigate} plan={plan} user={auth.user}/>
        <div className="desktop-content relative z-10">
          {page==="dashboard" && <Dashboard leads={leads} user={auth.user} plan={plan} credits={credits} onNavigate={navigate}/>}
          {page==="search"    && <SearchPage onLeadsFound={handleLeadsFound} plan={plan} credits={credits} onNeedUpgrade={()=>navigate("plans")}/>}
          {page==="leads"     && <LeadsPage leads={leads} onStatusChange={handleStatus} onUpdateLead={handleUpdateLead}/>}
          {page==="crm"       && <CRMPage leads={leads} onStatusChange={handleStatus} onUpdateLead={handleUpdateLead}/>}
          {page==="profile"   && <ProfilePage user={auth.user} plan={plan} credits={credits} onNavigate={navigate} onLogout={handleLogout}/>}
        </div>
      </div>
      <BottomNav active={page} onChange={navigate}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
